<h1>schedule-sync</h1>
<p>個人用のツールです。自分のパソコンにあるスケジュールメモを読み取り、自分のGoogleカレンダーに予定を登録します。</p>
<h2>プライバシーポリシー</h2>
<p>このツールは、作成者本人のGoogleカレンダーに予定を追加・削除するためだけにGoogleアカウントへのアクセスを使用します。取得したデータを外部に送信・保存・共有することはありません。</p>
